<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IngenieríaFlix</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#141414;
    color:white;
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    background:black;
    position:sticky;
    top:0;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:red;
}

input{
    width:250px;
    padding:10px;
    border:none;
    border-radius:5px;
}

/* HERO */
.hero{
    text-align:center;
    padding:40px;
}

.hero h1{
    font-size:40px;
    margin-bottom:10px;
}

/* CATEGORIAS */
.categorias{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:30px;
    flex-wrap:wrap;
}

button{
    padding:10px 20px;
    background:red;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

/* VIDEOS */
.container{
    width:95%;
    margin:auto;
}

.seccion{
    margin-bottom:40px;
}

.seccion h2{
    margin-bottom:20px;
}

.videos{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

iframe{
    border-radius:10px;
}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    background:black;
    margin-top:40px;
}
</style>

</head>
<body>

<header>
    <div class="logo">IngenieríaFlix</div>

    <input 
    type="text" 
    id="buscador"
    placeholder="Buscar videos..."
    onkeyup="buscarVideos()">
</header>

<section class="hero">
    <h1>Aprende Ingeniería Gratis</h1>
    <p>ASM, Arduino, Python, Electrónica y más.</p>
</section>

<div class="categorias">
    <button onclick="filtrar('todo')">Todo</button>
    <button onclick="filtrar('asm')">ASM</button>
    <button onclick="filtrar('arduino')">Arduino</button>
    <button onclick="filtrar('python')">Python</button>
</div>

<div class="container">

    <div class="videos" id="listaVideos">

        <div class="video asm">
            <h3>ASM 8086</h3>
            <iframe width="350" height="200"
            src="https://www.youtube.com/embed/VIDEO_ID"
            allowfullscreen></iframe>
        </div>

        <div class="video arduino">
            <h3>Arduino básico</h3>
            <iframe width="350" height="200"
            src="https://www.youtube.com/embed/VIDEO_ID"
            allowfullscreen></iframe>
        </div>

        <div class="video python">
            <h3>Python desde cero</h3>
            <iframe width="350" height="200"
            src="https://www.youtube.com/embed/VIDEO_ID"
            allowfullscreen></iframe>
        </div>

    </div>

</div>

<footer>
    © 2026 IngenieríaFlix
</footer>


<script>

function filtrar(categoria){

    let videos=document.querySelectorAll(".video");

    videos.forEach(video=>{

        if(categoria=="todo"){
            video.style.display="block";
        }

        else if(video.classList.contains(categoria)){
            video.style.display="block";
        }

        else{
            video.style.display="none";
        }

    });

}


function buscarVideos(){

    let texto=
    document.getElementById("buscador")
    .value
    .toLowerCase();

    let videos=
    document.querySelectorAll(".video");

    videos.forEach(video=>{

        let titulo=
        video.innerText.toLowerCase();

        if(titulo.includes(texto)){
            video.style.display="block";
        }
        else{
            video.style.display="none";
        }

    });

}

</script>

</body>
</html>
